# =============================================================================
# CI - Tests
# =============================================================================
# Runs on every PR and push to main
# Executes unit and integration tests

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_test
          POSTGRES_DB: biotact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "unit or not integration" -v --tb=short

      - name: Run integration tests
        # Skipped when OPENAI_API_KEY secret is not configured — integration
        # tests instantiate AsyncOpenAI at import time and fail without a key.
        # Set the secret via `gh secret set OPENAI_API_KEY` to enable.
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          DATABASE_URL: postgresql+asyncpg://biotact:biotact_test@localhost:5432/biotact_test
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -m integration -v --tb=short

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://biotact:biotact_test@localhost:5432/biotact_test
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest --cov=src/biotact --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
