# =============================================================================
# CD - Deploy to Server
# =============================================================================
# Triggers after successful Tests on main branch

name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Pull latest code (preserve node_modules)
            git fetch origin main
            git reset --hard origin/main

            # Restart API (source volume-mounted)
            docker compose -f docker-compose.prod.yml restart api

            # Build frontend
            cd frontend/dashboard
            npm ci --prefer-offline
            npm run build

            # Verify build before deploying
            test -f dist/index.html || { echo "Build failed: no index.html"; exit 1; }
            ls dist/assets/*.js >/dev/null 2>&1 || { echo "Build failed: no JS assets"; exit 1; }

            # Atomic deploy: copy new files first, then cleanup stale
            rsync -a --delete-after dist/ /var/www/dashboard/

            nginx -s reload
            cd ../..

            # Health check
            sleep 5
            curl -f http://localhost:8000/api/v1/health || exit 1
