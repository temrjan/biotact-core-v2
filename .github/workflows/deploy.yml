# =============================================================================
# CD - Deploy to Server
# =============================================================================
# Triggers after successful Tests on main branch, or manually

name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.event == 'push'
      )

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd /opt/biotact-core-v2

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild API image (picks up Dockerfile changes like ffmpeg)
            docker compose -f docker-compose.prod.yml build api

            # Recreate API (new image + source volume-mounted)
            docker compose -f docker-compose.prod.yml up -d api

            # Run pending database migrations — fail the deploy if they fail.
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head

            # Build frontend
            cd frontend/dashboard
            npm ci --prefer-offline
            npm run build

            # Verify build before deploying
            test -f dist/index.html || { echo "Build failed: no index.html"; exit 1; }
            ls dist/assets/*.js >/dev/null 2>&1 || { echo "Build failed: no JS assets"; exit 1; }

            # Atomic deploy
            rsync -a --delete-after dist/ /var/www/dashboard/

            nginx -s reload
            cd ../..

            # Health check
            sleep 5
            curl -f http://localhost:8000/api/v1/health || exit 1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
