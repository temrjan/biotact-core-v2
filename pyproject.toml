[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biotact"
version = "2.0.0"
description = "AI-powered RAG platform for Biotact pharmaceutical company"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Temrjan", email = "dev@biotact.uz" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",  # Sync driver for Alembic
    "alembic>=1.13.0",

    # Validation & Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",

    # Vector DB
    "qdrant-client>=1.12.0",

    # AI/LLM
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "telethon>=1.30.0",
    "redis>=5.0.0",
    "openai>=1.50.0",
    "aiogram>=3.0.0",
    "llama-index>=0.14.0",
    "llama-index-embeddings-openai",
    "llama-index-vector-stores-qdrant",
    "llama-index-llms-openai",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",  # SQLite async for integration tests

    # Type checking
    "mypy>=1.8.0",
    "types-python-jose>=3.3.0",

    # Linting & Formatting
    "ruff>=0.3.0",

    # Development
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/temrjan/biotact-core-v2"
Documentation = "https://github.com/temrjan/biotact-core-v2#readme"
Repository = "https://github.com/temrjan/biotact-core-v2"

[tool.hatch.build.targets.wheel]
packages = ["src/biotact"]

# ============================================================================
# RUFF - Linting & Formatting
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["biotact"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "PLR2004"]
"**/rag/*.py" = ["RUF001"]  # Allow Cyrillic in Russian prompts
"**/modules/**/*.py" = ["RUF001", "RUF002"]  # Allow Cyrillic in module prompts
"**/services/command_executor.py" = ["RUF001", "ARG002"]  # Allow Cyrillic + reserved params
"**/services/chat_service.py" = ["RUF001"]  # Allow Cyrillic in error messages
"**/api/**/*.py" = ["B008"]  # Allow Query/Depends in function defaults (FastAPI pattern)

# ============================================================================
# MYPY - Type Checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "jose.*",
]
ignore_missing_imports = true

# ============================================================================
# PYTEST - Testing
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, require DB)",
    "e2e: End-to-end tests (slowest, full stack)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ============================================================================
# COVERAGE - Test Coverage
# ============================================================================
[tool.coverage.run]
source = ["src/biotact"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 70
show_missing = true
