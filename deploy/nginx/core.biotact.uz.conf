server {
    listen 80;
    server_name core.biotact.uz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name core.biotact.uz;

    ssl_certificate /etc/letsencrypt/live/core.biotact.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core.biotact.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend - serve static files
    root /var/www/dashboard;
    index index.html;

    # API proxy
    location /api/ {
        client_max_body_size 300M;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Hash-versioned static assets — 404 if missing, cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend SPA - all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
