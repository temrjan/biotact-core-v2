# =============================================================================
# Biotact Platform v2 - Production Environment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Required environment variables (via .env.prod or secrets):
#   - OPENAI_API_KEY
#   - SECRET_KEY
#   - POSTGRES_PASSWORD

services:
  # ---------------------------------------------------------------------------
  # Biotact API
  # ---------------------------------------------------------------------------
  api:
    image: biotact-core-v2-api:latest
    container_name: biotact-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # App
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}

      # Database
      POSTGRES_HOST: biotact-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: biotact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biotact

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: knowledge-evolution

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # CORS
      CORS_ORIGINS: '["https://biotact.uz","https://app.biotact.uz","https://core.biotact.uz"]'

      # Telegram Bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NOTIFICATION_BOT_TOKEN: ${NOTIFICATION_BOT_TOKEN}
      SALES_GROUP_CHAT_ID: ${SALES_GROUP_CHAT_ID}

      # AskBiotact Public API
      ASKBIOTACT_API_KEY: ${ASKBIOTACT_API_KEY}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Together AI (HR Digest)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}

      # Firecrawl (HR Digest)
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}

      # Telegram API (HR Digest)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}

      # HR Digest
      HR_DIGEST_CHAT_ID: ${HR_DIGEST_CHAT_ID}
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
      - ./data/telegram_sessions:/app/.sessions:rw
      - ./data/hr_templates:/app/data/hr_templates:rw
      - ./data/hr_rendered:/app/data/hr_rendered:rw
      - ./data/uploads:/app/data/uploads:rw
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - biotact-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ---------------------------------------------------------------------------
  # HR Digest Telegram Bot
  # ---------------------------------------------------------------------------
  hr-digest-bot:
    image: biotact-core-v2-api:latest
    container_name: hr-digest-bot
    restart: unless-stopped
    command: python -m biotact.modules.hr.digest.bot
    environment:
      APP_ENV: production
      POSTGRES_HOST: biotact-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: biotact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biotact
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HR_DIGEST_BOT_TOKEN: ${HR_DIGEST_BOT_TOKEN}
      HR_DIGEST_CHAT_ID: ${HR_DIGEST_CHAT_ID}
      ALLOWED_USERS: ${ALLOWED_USERS}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
    volumes:
      - ./src:/app/src
      - ./data/telegram_sessions:/app/.sessions:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biotact-network
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: biotact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: biotact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biotact
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/true"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biotact-network

  # ---------------------------------------------------------------------------
  # Qdrant Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: biotact-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "/bin/true"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biotact-network

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: biotact-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biotact-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (optional)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: biotact-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - biotact-network
    profiles:
      - with-nginx  # Only start with: docker compose --profile with-nginx up

networks:
  biotact-network:
    driver: bridge

volumes:
  postgres_data:
    name: biotact_postgres_data_prod
  qdrant_data:
    name: biotact_qdrant_data_prod
  redis_data:
    name: biotact_redis_data_prod
