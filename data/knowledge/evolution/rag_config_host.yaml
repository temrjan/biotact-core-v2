# RAG Indexer Config — for running from HOST (not container)
# Uses Qdrant container IP instead of Docker DNS name

qdrant:
  collection: knowledge-evolution
  host: "172.18.0.5"
  port: 6333

source:
  path: /opt/biotact-core-v2/data/knowledge/evolution
  patterns:
    - "*.txt"

parser:
  format: sections
  section_start: "===СЕКЦИЯ==="
  section_end: "===/СЕКЦИЯ==="

bilingual:
  enabled: false
  languages:
    - code: ru
      title_pattern: "Название RU:\\s*(.+)"
      content_marker: "RU:"
      primary: true
    - code: uz
      title_pattern: "Название UZ:\\s*(.+)"
      content_marker: "UZ:"

chunking:
  max_chars: 8000
  min_chars: 50

embeddings:
  model: text-embedding-3-large
  dimensions: 3072
  batch_size: 10

metadata:
  department_id: askbiotact

indexing:
  incremental: false
  clean_orphaned: false
